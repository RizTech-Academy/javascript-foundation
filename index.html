<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tiffin order tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Tiffin order tracker</h1>
      <p id="rates-status" role="status">Loading today's rates…</p>
    </header>

    <main>
      <section aria-labelledby="new-order-heading">
        <h2 id="new-order-heading">New order</h2>

        <form id="order-form" novalidate>
          <div class="field">
            <label for="customer">Customer name</label>
            <input type="text" id="customer" name="customer" autocomplete="name" />
            <p class="error" id="customer-error"></p>
          </div>

          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" inputmode="numeric" autocomplete="tel" />
            <p class="error" id="phone-error"></p>
          </div>

          <div class="field">
            <label for="pincode">Pincode</label>
            <input type="text" id="pincode" name="pincode" inputmode="numeric" />
            <p class="error" id="pincode-error"></p>
          </div>

          <div class="field">
            <label for="plates">Plates</label>
            <input type="number" id="plates" name="plates" min="1" max="50" value="1" />
            <p class="error" id="plates-error"></p>
          </div>

          <div class="field">
            <label for="meal">Meal</label>
            <select id="meal" name="meal"></select>
            <p class="error" id="meal-error"></p>
          </div>

          <button type="submit">Add order</button>
        </form>
      </section>

      <section aria-labelledby="orders-heading">
        <h2 id="orders-heading">Orders</h2>

        <div class="controls">
          <input type="search" id="search" placeholder="Search name, pincode or area" aria-label="Search orders" />
          <div id="filters" role="group" aria-label="Filter orders">
            <button type="button" data-filter="all" aria-pressed="true">All</button>
            <button type="button" data-filter="pending" aria-pressed="false">Pending</button>
            <button type="button" data-filter="delivered" aria-pressed="false">Delivered</button>
          </div>
        </div>

        <p id="list-status" role="status"></p>
        <ul id="orders"></ul>
        <p id="summary"></p>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
